name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate files
        run: |
          set -e
          test -f app/main.swift
          test -f app/Info.plist
          test -f app/build.sh
          test -f README.md
          test -f README.zh-CN.md
          python3 -c "import plistlib;plistlib.load(open('app/Info.plist','rb'));print('Info.plist OK')"

      - name: Verify wallpaper coverage
        run: |
          set -e
          ls wallpapers/*.jpg | wc -l
          python3 - <<'EOF'
          import glob, os
          seasons = ['spring', 'summer', 'autumn', 'winter']
          types = ['rain', 'fog', 'snow', 'night', 'predawn', 'dusk',
                   'morning', 'afternoon', 'dawn', 'sunrise', 'bluehour']
          missing = [f'{s}_{t}' for t in types for s in seasons
                     if not os.path.exists(f'wallpapers/se_{s}_{t}.jpg')]
          assert not missing, missing
          total = len(glob.glob('wallpapers/*.jpg'))
          assert total == 68, total
          print(f'seasonal coverage complete, {total} wallpapers')
          EOF

  build:
    name: Compile on macOS
    runs-on: macos-latest
    needs: structure
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build TimeWallpaper.app
        run: |
          cd app
          chmod +x build.sh
          ./build.sh

      - name: Verify app bundle
        run: |
          set -e
          BIN=app/TimeWallpaper.app/Contents/MacOS/TimeWallpaper
          test -x "$BIN"
          file "$BIN"
          plutil -lint app/TimeWallpaper.app/Contents/Info.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeWallpaper-app
          path: app/TimeWallpaper.app
          if-no-files-found: error
