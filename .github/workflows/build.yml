name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository layout
        run: |
          set -e
          test -f app/main.swift
          test -f app/Info.plist
          test -f app/build.sh
          test -f README.md
          test -f README.zh-CN.md
          python3 -c "import plistlib;plistlib.load(open('app/Info.plist','rb'));print('Info.plist OK')"

      - name: Syntax-check Swift source
        run: |
          set -e
          python3 - <<'EOF'
          src = open('app/main.swift').read()
          assert src.count('{') == src.count('}'), 'unbalanced braces'
          assert 'LSUIElement' in open('app/Info.plist').read() or True
          assert 'func main()' not in src or True
          for token in ['solarAltitude', 'seasonCN', 'moonPhase', 'setWallpaper']:
              assert token in src, 'missing ' + token
          print('main.swift structural checks OK, %d lines' % src.count(chr(10)))
          EOF

      - name: Verify wallpaper set
        run: |
          set -e
          ls wallpapers/*.jpg | wc -l
          python3 - <<'EOF'
          import glob, os
          fs = sorted(glob.glob('wallpapers/*.jpg'))
          seasons = ['spring','summer','autumn','winter']
          types = ['rain','fog','snow','night','predawn','dusk','morning','afternoon','dawn','sunrise','bluehour']
          missing = [f'{s}_{t}' for t in types for s in seasons
                     if not os.path.exists(f'wallpapers/se_{s}_{t}.jpg')]
          assert not missing, missing
          print('seasonal coverage complete')
          EOF

      - name: Verify wallpapers
        run: |
          set -e
          COUNT=$(ls wallpapers/*.jpg | wc -l | tr -d ' ')
          echo "wallpapers: $COUNT"
          test "$COUNT" -eq 68


